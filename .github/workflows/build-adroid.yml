name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone API dependency
        run: |
          git clone https://github.com/frostre1997/Click-Beyond-Frames-API.git

      - name: Build Android 64-bit
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: android64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Click-Beyond-Frames-Android
          path: build/*.geode
          
